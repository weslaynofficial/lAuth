  enabled: true
  title: "<color:#FF4D6D>ʟᴏᴜʀꜱᴀ</color> <color:#7F1D1D>│</color> <color:#E5989B>Sunucu Kurallari</color>"
  body:
    - ""
    - "<gradient:#FF4D6D:#FF6B6B:#C1121F>ʟᴏᴜʀꜱᴀ ᴘʀᴏᴊᴇᴄᴛ</gradient>"
    - ""
    - "<color:#FF6B6B>1.</color> <color:#FFD1D1>Hile, hack ve haksiz avantaj kullanimi yasaktir.</color>"
    - "<color:#FF6B6B>2.</color> <color:#FFD1D1>Reklam yapmak ve spam atmak yasaktir.</color>"
    - "<color:#FF6B6B>3.</color> <color:#FFD1D1>Diger oyunculara hakaret ve kufur yasaktir.</color>"
    - "<color:#FF6B6B>4.</color> <color:#FFD1D1>Bug/acik kullanimi yasaktir, bildirin.</color>"
    - "<color:#FF6B6B>5.</color> <color:#FFD1D1>Yetkililerin kararlarina saygi gosterin.</color>"
    - ""
    - "<color:#FFD1D1>Kurallari kabul etmek icin</color> <color:#FF6B6B>Onayla</color> <color:#FFD1D1>butonuna basin.</color>"
  confirmButton: "<color:#FF6B6B>Onayla</color>"
  # Kabul etmeme kick mesajı
  decline-kick-message: "<color:#FF6B6B>Kuralları kabul etmediniz.</color>"
  agree:
    enabled: true
    key: "agree"
    label: "<color:#FFD1D1>Kurallari okudum ve kabul ediyorum</color>"

# ==================== GÖRSEL EFEKTLER ====================
effects:
  # === Giriş yapmadan önce (bekleme ekranı) ===
  waiting:
    # Actionbar mesajı (sürekli gösterilir)
    actionbar:
      enabled: true
      message: "<color:#FF6B6B>⚠</color> <color:#FFD1D1>Lutfen giris yapiniz veya kayit olunuz!</color> <color:#FF6B6B>⚠</color>"
      update-ticks: 20
    # Title (girişte bir kere gösterilir)
    title:
      enabled: true
      title: "<gradient:#FF4D6D:#FF6B6B:#C1121F>ʟᴏᴜʀꜱᴀ</gradient>"
      subtitle: "<color:#FFD1D1>Giris yapmak icin dialogu kullaniniz</color>"
      fade-in: 10
      stay: 60
      fade-out: 20

  # === Başarılı giriş sonrası ===
  login-success:
    title:
      enabled: true
      title: "<color:#FF6B6B>Hos Geldiniz!</color>"
      subtitle: "<color:#FFD1D1>%player_name%, ʟᴏᴜʀꜱᴀ ᴘʀᴏᴊᴇᴄᴛ'e giris yaptiniz</color>"
      fade-in: 5
      stay: 40
      fade-out: 10
    sound:
      enabled: true
      type: "ENTITY_PLAYER_LEVELUP"
      volume: 0.7
      pitch: 1.5
    actionbar:
      enabled: true
      message: "<color:#FF6B6B>✔ Basariyla giris yapildi!</color>"

  # === Başarılı kayıt sonrası ===
  register-success:
    title:
      enabled: true
      title: "<color:#FFB3C1>Kayit Basarili!</color>"
      subtitle: "<color:#FFD1D1>%player_name%, hesabiniz olusturuldu</color>"
      fade-in: 5
      stay: 40
      fade-out: 10
    sound:
      enabled: true
      type: "ENTITY_PLAYER_LEVELUP"
      volume: 0.8
      pitch: 1.2
    actionbar:
      enabled: true
      message: "<color:#FFB3C1>✔ Hesabiniz basariyla olusturuldu!</color>"

  # === Yanlış şifre girişi ===
  login-fail:
    title:
      enabled: true
      title: "<color:#FF6B6B>Yanlış Şifre!</color>"
      subtitle: "<color:#FFD1D1>Tekrar deneyiniz</color>"
      fade-in: 5
      stay: 20
      fade-out: 10
    sound:
      enabled: true
      type: "ENTITY_VILLAGER_NO"
      volume: 0.8
      pitch: 1.0

  # === Çıkış yaptığında ===
  logout:
    title:
      enabled: true
      title: "<color:#E5989B>Cikis Yapildi</color>"
      subtitle: "<color:#FFD1D1>Tekrar giris yapmaniz gerekmektedir</color>"
      fade-in: 5
      stay: 30
      fade-out: 10
    sound:
      enabled: true
      type: "BLOCK_NOTE_BLOCK_BASS"
      volume: 0.8
      pitch: 0.5

