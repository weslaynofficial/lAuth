# ==================== LOGLAMA ====================
logging:
  # Giriş/kayıt/çıkış olaylarını konsola logla
  enabled: true
  # Log formatı
  login: "[lAuth] %player% basariyla giris yapti. (IP: %ip%)"
  register: "[lAuth] %player% yeni hesap olusturdu. (IP: %ip%)"
  logout: "[lAuth] %player% cikis yapti."
  failed-login: "[lAuth] %player% yanlis sifre girdi. (Deneme: %attempts%) (IP: %ip%)"
  kick-timeout: "[lAuth] %player% sure doldugu icin atildi."
  kick-attempts: "[lAuth] %player% cok fazla yanlis deneme yaptigi icin atildi."
  rule-accepted: "[lAuth] %player% sunucu kurallarini kabul etti. (IP: %ip%, Tarih: %date%)"
  rule-declined: "[lAuth] %player% sunucu kurallarini reddetti. (IP: %ip%, Tarih: %date%)"
  password-changed: "[lAuth] %player% sifresini degistirdi. (IP: %ip%)"

# ==================== GİRİŞ AYARLARI ====================
auth:
  min-password-length: 4
  max-password-length: 30
  # Giriş yapma süresi (saniye) - süre dolunca oyuncu atılır (0 = devre dışı)
  login-timeout: 60
  # Maksimum yanlış şifre denemesi (0 = sınırsız)
  max-login-attempts: 5
  # Oturum sistemi - aynı IP ile tekrar girişte şifre sorma (dakika, 0 = devre dışı)
  session-timeout: 30
  # Giriş yapmadan önce oyuncuya körlük efekti ver
  blind-effect: true
  # Giriş yapmadan önce oyuncuyu dondur (hareket engelle)
  freeze-player: true
  # Giriş yapmadan önce sohbeti engelle
  block-chat: true
  # Giriş yapmadan önce komutları engelle
  block-commands: true
  # İzin verilen komutlar (giriş yapmadan kullanılabilir)
  allowed-commands:
    - "/LAuth"
    - "/ka"
    - "/giris"
    - "/kayit"
    - "/cikis"
    - "/login"
    - "/register"
    - "/logout"
    - "/l"
    - "/reg"
    - "/maildogrula"
    - "/mailkod"
  # Zayıf şifreleri engelle (123456, qwerty, oyuncu adı vs.)
  block-weak-passwords: true
  # IP bazlı brute-force koruması - bu kadar denemeden sonra IP engellenir
  max-ip-attempts: 20
  # IP engellenme süresi (dakika)
  ip-block-minutes: 10
  # Aynı IP'den maksimum hesap sayısı (0 = sınırsız)
  max-accounts-per-ip: 3
  # Son giriş bilgisini göster (IP ve zaman)
  show-last-login: true
  # Timeout kick mesajı
  timeout-kick-message: "<color:#FF6B6B>Giriş süresi doldu! Tekrar bağlanınız.</color>"
  # Max deneme kick mesajı
  max-attempts-kick-message: "<color:#FF6B6B>Çok fazla yanlış deneme! Tekrar bağlanınız.</color>"

# ==================== DİALOG AYARLARI ====================
dialog:
  canCloseWithEscape: false
  columns: 2

# ==================== GİRİŞ DİALOGU ====================
login:
  title: "<color:#FF4D6D>ʟᴏᴜʀꜱᴀ</color> <color:#7F1D1D>│</color> <color:#FF6B6B>Giris Yap</color>"
  body:
    - ""
    - "<gradient:#FF4D6D:#FF6B6B:#C1121F>ʟᴏᴜʀꜱᴀ ᴘʀᴏᴊᴇᴄᴛ</gradient>"
    - ""
    - "<color:#FFD1D1>Hos geldiniz! Hesabiniza giris yapiniz.</color>"
    - ""
  width: 200
  actions:
    - type: submit
      label: "<color:#FF6B6B>Giris Yap</color>"
  # İptal butonu
  cancel-label: "<color:#FF6B6B>İptal</color>"

# ==================== KAYIT DİALOGU ====================
register:
  title: "<color:#FF4D6D>ʟᴏᴜʀꜱᴀ</color> <color:#7F1D1D>│</color> <color:#FFB3C1>Kayit Ol</color>"
  body:
    - ""
    - "<gradient:#FF4D6D:#FF6B6B:#C1121F>ʟᴏᴜʀꜱᴀ ᴘʀᴏᴊᴇᴄᴛ</gradient>"
    - ""
    - "<color:#FFD1D1>Yeni bir hesap olusturunuz.</color>"
    - ""
  width: 200
  email_input:
    enabled: true
    label: "Gmail Adresi"
  actions:
    - type: submit
      label: "<color:#FFB3C1>Kayit Ol</color>"
  cancel-label: "<color:#FF6B6B>İptal</color>"

# ==================== E-POSTA DOGRULAMA DİALOGU ====================
email-verify:
  title: "<color:#FF4D6D>ʟᴏᴜʀꜱᴀ</color> <color:#7F1D1D>│</color> <color:#FFB3C1>Mail Dogrulama</color>"
  body:
    - ""
    - "<gradient:#FF4D6D:#FF6B6B:#C1121F>ʟᴏᴜʀꜱᴀ ᴘʀᴏᴊᴇᴄᴛ</gradient>"
    - ""
    - "<color:#FFD1D1>Mail adresinize gonderilen 6 haneli kodu girin.</color>"
    - "<color:#E5989B>Kod gelmediyse /mailkod yazabilirsiniz.</color>"
    - ""
  width: 200
  input-label: "Dogrulama Kodu"
  submit-label: "<color:#FF6B6B>Dogrula</color>"
  cancel-label: "<color:#FF6B6B>Iptal</color>"

# ==================== MAIL AYARLARI ====================
mail:
  smtp:
    host: "smtp.gmail.com"
    port: "587"
    user: ""
    app-password: ""
  from-name: "lAuth"
  subject: "lAuth Mail Dogrulama Kodu"
  code-expire-seconds: 300

# ==================== KURAL DİALOGU ====================
